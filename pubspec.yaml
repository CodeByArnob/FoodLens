name: foodlens
description: "FoodLens - Global AI-Powered Food Intelligence and Nutrition Analysis Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  webview_flutter: ^4.14.1
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  fl_chart: ^1.3.0
  uuid: ^4.6.0
  intl: ^0.20.2
  http: ^1.6.0
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/html/
    - assets/data/
    - assets/icons/
