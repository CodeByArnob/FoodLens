name: FoodLens CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze_and_test:
    name: Code Analysis & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Flutter Static Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test --coverage

  build_apk:
    name: Build Android Verification APK
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Build Debug-Signed Verification APK
        env:
          FOODLENS_ALLOW_DEBUG_SIGNING: "true"
        run: flutter build apk --release

      - name: Upload Verification APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodLens-Verification-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
