name: "🐛 Bug Report"
description: "File a general bug report or defect with reproduction steps."
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with FoodLens! Please provide as much context as possible to help us reproduce and resolve the problem.
  - type: input
    id: environment
    attributes:
      label: "Device & Environment"
      description: "Provide device model, Android version, and Flutter version."
      placeholder: "e.g., Realme 8 (RMX3085), Android 13, Flutter 3.44.4"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Problem Description"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Clear numbered steps explaining how to trigger the issue."
      placeholder: |
        1. Open FoodLens app
        2. Navigate to '...'
        3. Tap on '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Relevant Logs or Screenshots"
      description: "Paste sanitized `adb logcat` output, Flutter terminal logs, or attach screenshots."
      render: shell
